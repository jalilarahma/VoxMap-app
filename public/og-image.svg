<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Glow circle -->
  <circle cx="600" cy="280" r="200" fill="url(#glow)" opacity="0.4"/>

  <!-- Globe icon -->
  <circle cx="600" cy="220" r="60" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <ellipse cx="600" cy="220" rx="30" ry="60" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <line x1="540" y1="220" x2="660" y2="220" stroke="url(#accent)" stroke-width="2"/>
  <line x1="550" y1="195" x2="650" y2="195" stroke="url(#accent)" stroke-width="1.5"/>
  <line x1="550" y1="245" x2="650" y2="245" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Pin dots on globe -->
  <circle cx="575" cy="205" r="4" fill="#22c55e"/>
  <circle cx="620" cy="230" r="4" fill="#ef4444"/>
  <circle cx="590" cy="245" r="4" fill="#f97316"/>
  <circle cx="615" cy="200" r="4" fill="#22c55e"/>

  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="url(#accent)">VoxMap</text>

  <!-- Subtitle -->
  <text x="600" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="28" fill="#94a3b8">The Living Voice of the People</text>

  <!-- Bottom tagline -->
  <text x="600" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="22" fill="#64748b">Vote Daily · See the World React · Earn Your Crown</text>

  <!-- Bottom accent line -->
  <rect x="350" y="520" width="500" height="4" rx="2" fill="url(#accent)"/>

  <!-- URL -->
  <text x="600" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="20" fill="#475569">voxmap-app.vercel.app</text>
</svg>
